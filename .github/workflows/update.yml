name: RKI-Daten aktualisieren

# RKI veröffentlicht die Wochenberichte unter der Woche;
# Freitag 08:00 UTC ist ein sicherer Zeitpunkt für alle drei Quellen.
on:
  schedule:
    - cron: "0 8 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Daten holen und Dashboard-Daten neu bauen
        run: python scripts/build_data.py

      - name: Committen und pushen (nur bei Änderungen)
        run: |
          if git diff --quiet -- data/dashboard_data.json assets/data.js data/europe_data.json assets/europe_data.js; then
            echo "Keine neuen Daten – nichts zu tun."
            exit 0
          fi
          git config user.name  "rki-board-bot"
          git config user.email "rki-board-bot@users.noreply.github.com"
          git add data/dashboard_data.json assets/data.js data/europe_data.json assets/europe_data.js
          git commit -m "Daten aktualisiert ($(date -u +%F, %H:%M UTC))"
          git push
